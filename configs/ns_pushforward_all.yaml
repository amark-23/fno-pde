# Pushforward with loss on every step (keeps single-step accuracy while training
# on the model's own rolled-out inputs).
model: fno
data: data/navier_stokes.npz
n_train_traj: 800
n_test_traj: 200
modes1: 12
modes2: 12
width: 32
depth: 4
epochs: 50
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
seed: 0
rollout_steps: 4
pushforward: true
loss_all_steps: true
warmup_epochs: 30
noise_std: 0.0
eval_rollout_steps: 19
